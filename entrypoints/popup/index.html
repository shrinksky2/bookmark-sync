<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Bookmark Sync</title>
  <style>
    body {
      width: 300px;
      padding: 12px;
      font-family: system-ui;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 8px;
      margin: 4px 0;
      cursor: pointer;
      box-sizing: border-box;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .counts {
      font-size: 13px;
      color: #555;
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .counts span {
      font-weight: bold;
      color: #000;
    }
    .notice {
      display: none;
      background: #fff4e5;
      border: 1px solid #ffcc80;
      color: #8a5300;
      padding: 8px;
      font-size: 12px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .notice.show { display: block; }
    .notice button {
      margin-top: 6px;
      padding: 4px 8px;
      font-size: 12px;
      width: auto;
    }
    .section-title {
      font-size: 11px;
      color: #999;
      margin-top: 12px;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .row-buttons {
      display: flex;
      gap: 6px;
    }
    .row-buttons button {
      margin: 0;
      font-size: 12px;
      padding: 6px;
    }

    .confirm-panel {
      display: none;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      margin: 8px 0;
      background: #fafafa;
    }
    .confirm-panel.show { display: block; }
    .confirm-title {
      font-weight: 600;
      margin-bottom: 6px;
    }
    .confirm-body {
      font-size: 12px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .confirm-actions {
      display: flex;
      gap: 6px;
    }
    .confirm-actions button {
      flex: 1;
      margin: 0;
      font-size: 12px;
      padding: 6px;
    }
    .btn-danger {
      background: #f44336;
      color: white;
      border: none;
    }
    .btn-danger:hover {
      background: #d32f2f;
    }

    /* 同步信息区 */
    .sync-info {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #666;
    }
    .result-line {
      margin-bottom: 6px;
      font-weight: 600;
      color: #888;
    }
    .result-line.ok { color: #4caf50; }
    .result-line.err { color: #f44336; }
    .meta-line {
      line-height: 1.7;
    }
    .meta-line span {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="counts">
    本地书签：<span id="local-count">-</span><br/>
    远程书签：<span id="remote-count">-</span>
  </div>

  <div id="notice" class="notice">
    <div id="notice-text">尚未绑定账号。</div>
    <button id="go-bind">去绑定账号</button>
  </div>

  <div id="confirm-panel" class="confirm-panel">
    <div class="confirm-title" id="confirm-title">确认操作</div>
    <div class="confirm-body" id="confirm-body"></div>
    <div class="confirm-actions">
      <button id="confirm-cancel">取消</button>
      <button id="confirm-ok" class="btn-danger">确认</button>
    </div>
  </div>

  <button id="sync-now">立即同步</button>

  <div class="section-title">强制方向（谨慎使用）</div>
  <div class="row-buttons">
    <button id="force-upload">覆盖上传</button>
    <button id="force-download">从云端下载</button>
  </div>

  <div class="section-title">设置</div>
  <button id="open-options">打开设置页</button>

  <!-- 同步信息区 -->
  <div class="sync-info">
    <div id="sync-result" class="result-line">尚未同步</div>
    <div class="meta-line">上次同步：<span id="last-time">-</span></div>
    <div class="meta-line">上次操作：<span id="last-op">-</span></div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
